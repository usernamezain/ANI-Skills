<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Reference: animation-accessibility-performance-audit</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0b0b;
      color: #f5f5f5;
      overflow-x: hidden;
    }
    
    /* Combined CSS from skill */
    @media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
  </style>
</head>
<body>

  <!-- Combined HTML Structure -->
  <h1 aria-label="Design that moves people.">
  <span aria-hidden="true"><span class="char">D</span><span class="char">e</span>...</span>
</h1>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Register GSAP ScrollTrigger if present
      if (typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
      }

      // Basic Lenis scroll integration if needed
      if (typeof Lenis !== "undefined") {
        const lenis = new Lenis({
          duration: 1.1,
          easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true
        });
        lenis.on("scroll", ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0);
      }

      // Combined Animation Code
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (prefersReducedMotion) {
  gsap.set(".reveal", { opacity: 1, y: 0, clearProps: "all" }); // show final state instantly, skip the animation entirely
} else {
  gsap.from(".reveal", { y: 40, opacity: 0, duration: 0.8, scrollTrigger: { trigger: ".reveal", start: "top 85%" } });
}
    });
  </script>
</body>
</html>
