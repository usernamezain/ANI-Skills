<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Reference: buttery-smooth-120fps-performance</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0b0b;
      color: #f5f5f5;
      overflow-x: hidden;
    }
    
    /* Combined CSS from skill */
    .about-to-animate { will-change: transform, opacity; }

<body>

  <!-- Combined HTML Structure -->
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Register GSAP ScrollTrigger if present
      if (typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
      }

      // Basic Lenis scroll integration if needed
      if (typeof Lenis !== "undefined") {
        const lenis = new Lenis({
          duration: 1.1,
          easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true
        });
        lenis.on("scroll", ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0);
      }

      // Combined Animation Code
      const lenis = new Lenis({
  duration: 1.1,
  easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
  smoothWheel: true
});
function raf(time) {
  lenis.raf(time);
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

lenis.on("scroll", ScrollTrigger.update);
gsap.ticker.add((time) => { lenis.raf(time * 1000); });
gsap.ticker.lagSmoothing(0);

// Bad — animates layout-triggering properties every frame
gsap.to(".box", { left: 400, top: 200 });
// Good — same visual result, GPU-composited only
gsap.to(".box", { x: 400, y: 200 });

let rectCache = null;
function cacheRects() { rectCache = [...document.querySelectorAll(".item")].map(el => el.getBoundingClientRect()); }
cacheRects();
window.addEventListener("resize", cacheRects);
// use rectCache inside mousemove instead of calling getBoundingClientRect() live every event
    });
  </script>
</body>
